<ion-content class="login-content" [fullscreen]="true">
  <div class="login-wrapper">
    <ion-card>
      <ion-card-header>
        <ion-card-title>Gestor Bancario</ion-card-title>
        <ion-card-subtitle>Iniciar sesion</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Correo</ion-label>
          <ion-input
            type="email"
            placeholder="cajero@gestor.hn"
            autocomplete="off"
            [(ngModel)]="credenciales.correo"
          ></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Contrasena</ion-label>
          <ion-input
            type="password"
            placeholder="********"
            autocomplete="new-password"
            [(ngModel)]="credenciales.password"
          ></ion-input>
        </ion-item>

        <ion-button expand="block" class="ion-margin-top" (click)="ingresar()" [disabled]="loading">
          {{ loading ? 'Ingresando...' : 'Entrar' }}
        </ion-button>

        <div class="biometria-access" role="group" aria-label="Acceso biometrico">
          <ion-button
            class="biometria-icon-btn"
            [class.biometria-icon-btn--active]="huellaActiva"
            [class.biometria-icon-btn--inactive]="!huellaActiva"
            fill="clear"
            (click)="ingresarConHuella()"
            [disabled]="loading"
            aria-label="Ingresar con huella"
          >
            <ion-icon name="finger-print-outline" aria-hidden="true"></ion-icon>
          </ion-button>

          <ion-text class="biometria-label" color="dark">Ingresar con huella</ion-text>
        </div>

        <ion-button fill="clear" expand="block" color="medium" (click)="recuperarPassword()">
          Olvide mi contrasena
        </ion-button>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
